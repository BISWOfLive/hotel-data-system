# Alembic configuration -- Segment 1, task T1.4
#
# NOTE (do not "helpfully" add non-ASCII text to this file):
#   Alembic reads alembic.ini with encoding="locale". On a Chinese Windows the
#   locale codec is GBK, so any UTF-8 CJK comment here raises
#       UnicodeDecodeError: 'gbk' codec can't decode byte ...
#   BEFORE any migration runs. Keep this file pure ASCII.
#   The Chinese rationale for these settings lives in
#   src/hoteldata/infra/migrations/env.py (read as UTF-8) instead.
#
# DDL goes through Alembic only. No CREATE TABLE IF NOT EXISTS, no
# "try: ALTER ... except: pass" pseudo-migrations.
#
# sqlalchemy.url is deliberately left EMPTY: the single source of the
# connection string is DB_URL in .env, injected by
# src/hoteldata/infra/migrations/env.py. Putting it here would immediately
# create a second source of truth -- same discipline as
# "the schedule lives only in the task registry".

[alembic]
script_location = src/hoteldata/infra/migrations
prepend_sys_path = . src
path_separator = os
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = Asia/Shanghai
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
